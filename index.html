<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyDash</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: linear-gradient(#1E3C72, #87CEEB); color: #fff; text-align: center; }
  main { padding: 32px 24px; max-width: 480px; }
  h1 { font-size: 44px; margin: 0 0 8px; }
  p { font-size: 18px; margin: 0 0 28px; opacity: .9; }
  a { display: block; margin: 12px auto; padding: 14px 20px; border-radius: 14px; text-decoration: none;
      font-weight: 700; max-width: 280px; }
  .play { background: #FFD700; color: #1E3C72; }
  .policy { background: rgba(255,255,255,.2); color: #fff; }
</style>
</head>
<body>
<main>
  <h1>SkyDash</h1>
  <p>Tap &amp; fly through the sky. A free mobile game for Android.</p>
  <a class="play" href="https://play.google.com/store/apps/details?id=com.mvbgames.skydash">Get it on Google Play</a>
  <a class="policy" href="https://sites.google.com/view/skydash-gizlilik-2026">Privacy Policy</a>
</main>
</body>
</html>
